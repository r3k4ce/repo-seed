name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly drift check: scaffolds real projects against live registries so a
    # yanked package or a tool change is caught before you start a new project.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Unit, snapshot and wheel tests
        run: uv run pytest

      - name: Install Qt system library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Scaffold e2e (all profiles)
        env:
          REPOSEED_E2E_GAME: "1"
        run: uv run pytest -m e2e

      # Old scaffolders: these steps go away with new-project.sh and new-project.ps1.
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck --severity=warning new-project.sh install.sh tests/*.sh

      - name: Contract tests
        if: runner.os == 'Linux'
        run: bash tests/cross_platform_contract.sh

      - name: Script template contract
        if: runner.os == 'Linux'
        run: bash tests/script_templates_contract.sh

      - name: Script template lint
        if: runner.os == 'Linux'
        run: bash tests/lint_script_templates.sh

      - name: Scaffold e2e, old Bash scaffolder (base, web, game)
        if: runner.os == 'Linux'
        env:
          REPOSEED_E2E_GAME: "1"
        run: bash tests/scaffold_e2e.sh

      - name: PowerShell web contract (fake tools)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/powershell_web_contract.ps1

      - name: PowerShell web scaffold e2e
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/scaffold_e2e.ps1
