name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly drift check: scaffolds real projects against live registries so a
    # yanked package or a tool change is caught before you start a new project.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: uv sync --locked

      # Builds the wheel and runs its real `reposeed` entry point (an .exe shim on Windows).
      - name: Installed command
        run: uvx --from . reposeed --version

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Unit, snapshot and wheel tests
        run: uv run pytest

      # The oldest Python RepoSeed supports, in a throwaway environment so the
      # steps below keep the project's own .venv.
      - name: Unit tests on Python 3.10
        if: runner.os == 'Linux'
        run: uv run --locked --python 3.10 --isolated pytest

      - name: Install Qt system library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Scaffold e2e (all profiles)
        env:
          REPOSEED_E2E_GAME: "1"
        run: uv run pytest -m e2e
