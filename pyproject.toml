[project]
name = "reposeed"
version = "0.2.0"
description = "Scaffold new Python, desktop, web and game projects with exact, tested tool versions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reposeed = "reposeed.cli:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "pyright==1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: real-tool scaffolds (slow)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py310"
# Templates contain __PLACEHOLDER__ names, except templates/scripts/, which is copied
# verbatim and linted here with the same rules generated projects use.
# Snapshots are generated projects with their own Ruff settings; they are compared, not linted.
extend-exclude = [
    "src/reposeed/templates/base",
    "src/reposeed/templates/common",
    "src/reposeed/templates/desktop",
    "src/reposeed/templates/game",
    "src/reposeed/templates/web",
    "tests/snapshots",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.pyright]
include = ["src"]
# Same template exclusions as Ruff: templates/scripts/ is type-checked.
exclude = [
    "src/reposeed/templates/base",
    "src/reposeed/templates/common",
    "src/reposeed/templates/desktop",
    "src/reposeed/templates/game",
    "src/reposeed/templates/web",
]
typeCheckingMode = "strict"
pythonVersion = "3.10"
